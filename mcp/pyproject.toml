[project]
name = "podcast-mcp"
version = "0.1.0"
description = "MCP server: let an AI agent search, plan and cut from your podcast library."
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
podcast-mcp = "podcast_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_mcp"]
