name: Feature idea
description: Something you wish this app did.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward
      description: What are you trying to do, and where does the app get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd want instead
      description: A rough idea is fine — it doesn't need to be a full design.
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I checked the README and CONTRIBUTING.md's "good first issues" — this isn't already listed there.
          required: false
