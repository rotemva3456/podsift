# Tests, image builds and an install smoke test. On a v* tag, the images are pushed to GHCR.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    name: Public source boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-public-source.py

  companion:
    name: Companion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: companion/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install Python packages
        run: python -m pip install --requirement companion/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q companion
      - name: Agent workflow through HTTP and original audio export
        run: |
          python -m pip install -e "./mcp[dev]"
          MCP_PYTHON="$(command -v python)" python scripts/verify-agent-workflow.py

  mcp:
    name: Agent MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - run: python -m pip install -e "./mcp[dev]"
      - run: python -m pytest -q mcp/tests

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: pnpm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser fixture dependencies
        run: python -m pip install --requirement ../companion/requirements.txt pytest
      - name: Install synthetic media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Sponsor skipping on desktop and mobile
        run: node ../scripts/verify-skipping.cjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/skipping
          UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Focus and Chill on desktop and mobile
        run: node ../scripts/verify-learning-modes.cjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/learning-modes
          UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Video import, learning and cancellation
        run: node ../scripts/verify-video-learning.cjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/video-learning
          UI_DIST: ${{ github.workspace }}/ui/dist
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-acceptance
          path: |
            ${{ runner.temp }}/skipping
            ${{ runner.temp }}/learning-modes
            ${{ runner.temp }}/video-learning
          if-no-files-found: ignore

  images:
    name: Image ${{ matrix.image }}
    needs: [source, companion, mcp, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: docker/app.Dockerfile
          - image: companion
            dockerfile: docker/companion.Dockerfile
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        # GHCR names must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    name: Install smoke test
    needs: [source, companion, mcp, ui]
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - name: Companion reads provider settings from an env file
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          keys = ('LLM_BASE_URL', 'LLM_API_KEY', 'LLM_MODEL', 'TRANSCRIPTION_API_BASE_URL',
                  'TRANSCRIPTION_API_KEY', 'TRANSCRIPTION_MODEL', 'COURSE_WATCHER_URL',
                  'COURSE_WATCHER_PUBLIC_URL', 'ALLOW_PRIVATE_FEEDS')
          with tempfile.TemporaryDirectory() as directory:
              fixture = Path(directory) / 'providers.env'
              expected = {key: 'fixture-' + key for key in keys}
              fixture.write_text(''.join(f'{key}={value}\n' for key, value in expected.items()))
              environment = {key: value for key, value in os.environ.items() if key not in keys}
              config = json.loads(subprocess.check_output(
                  ['docker', 'compose', '--env-file', str(fixture), 'config', '--format', 'json'], env=environment))
              actual = config['services']['companion']['environment']
              assert all(actual.get(key) == value for key, value in expected.items())
          print('Provider env-file configuration passed.')
          PY
      - name: Start with docker compose
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Companion answers through Caddy
        run: curl --fail --silent --show-error http://127.0.0.1:8080/companion/health
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Caddy serves the installed UI and its modules
        run: node scripts/verify-installed-assets.cjs http://127.0.0.1:8080
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove
        if: always()
        run: docker compose down --volumes
